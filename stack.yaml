version: 1.0
provider:
  name: openfaas
  gateway: ${OPENFAAS_URL:-https://openfaas.o6s.io}

configuration:
  templates:
    - name: dockerfile
      source: https://github.com/openfaas/templates
    - name: python3-http
      source: https://github.com/openfaas/python-flask-template
    - name: python3
      source: https://github.com/openfaas/templates-classic

functions:
  # FastAPI, no watchdog: the app serves 8080 and the health checks itself.
  fastapi:
    lang: dockerfile
    handler: ./fastapi
    image: ${REGISTRY:-docker.io/alexellis2}/fastapi:${TAG:-latest}
    annotations:
      com.openfaas.ready.http.path: /ready

  # The same FastAPI app, with of-watchdog in front of it in HTTP mode.
  fastapi-watchdog:
    lang: dockerfile
    handler: ./fastapi-watchdog
    image: ${REGISTRY:-docker.io/alexellis2}/fastapi-watchdog:${TAG:-latest}
    annotations:
      com.openfaas.ready.http.path: /ready

  # The python3-http template, used as-is.
  python3-http-echo:
    lang: python3-http
    handler: ./python3-http-echo
    image: ${REGISTRY:-docker.io/alexellis2}/python3-http-echo:${TAG:-latest}
    annotations:
      com.openfaas.ready.http.path: /ready

  # The classic watchdog: forks the handler once per request.
  python3-classic:
    lang: python3
    handler: ./python3-classic
    image: ${REGISTRY:-docker.io/alexellis2}/python3-classic:${TAG:-latest}
    environment:
      content_type: application/json
